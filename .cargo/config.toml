# Build configuration for linker/runtime flags.
#
# Current backend policy (configured in workspace Cargo.toml):
#   - dev/test/release/bench profiles: LLVM
# Reason: MORK/pathmap depend on CPU feature propagation (e.g. AES/SSE2) that
# LLVM handles reliably with target-cpu/native flags.
#
# For memory-constrained CI or local checks we use an explicit Cranelift fallback
# via scripts/tools (`tools/cargo_lowmem.sh`), not as the default profile backend.
#
# Prerequisites:
#   Linux: mold linker (https://github.com/rui314/mold)
#     Install: sudo pacman -S mold        (Arch)
#              sudo apt install mold       (Debian/Ubuntu)
#              sudo dnf install mold       (Fedora)
#   macOS: lld linker via LLVM (https://lld.llvm.org/)
#     Install: brew install llvm
#     Ensure llvm bin is in PATH:
#       Apple Silicon: export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
#       Intel Mac:     export PATH="/usr/local/opt/llvm/bin:$PATH"
#   All platforms: nightly toolchain
#
# If mold/lld is not installed, comment out the linker and link-arg lines
# for your platform.

# Enable unstable per-profile codegen-backend selection in Cargo.toml
[unstable]
codegen-backend = true

# --- Linux x86_64 ---
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-cpu=native", "-C", "target-feature=+aes,+sse2"]

# --- macOS Apple Silicon ---
[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# --- macOS Intel ---
[target.x86_64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
