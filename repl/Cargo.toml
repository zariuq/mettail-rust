[package]
name = "mettail-repl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mettail"
path = "src/main.rs"
doc = false  # Same binary as root package; document only from workspace root to avoid path collision

[features]
default = [
    "lang-ambient",
    "lang-calculator",
    "lang-imp",
    "lang-lambda",
    "lang-mettafull-legacy",
    "lang-he",
    "lang-minskylite",
    "lang-mm0lite",
    "lang-pyashcore",
    "lang-petta",
    "lang-rhocalc",
]
query-support = ["dep:mettail-query"]
wfst = ["mettail-languages/wfst"]
wfst-log = ["mettail-languages/wfst-log"]
mork-backend = ["mettail-languages/mork-backend"]
lang-ambient = ["mettail-languages/lang-ambient"]
lang-calculator = ["mettail-languages/lang-calculator"]
lang-imp = ["mettail-languages/lang-imp"]
lang-lambda = ["mettail-languages/lang-lambda"]
lang-mettafull-legacy = ["mettail-languages/lang-mettafull-legacy"]
lang-he = ["mettail-languages/lang-he"]
lang-minskylite = ["mettail-languages/lang-minskylite"]
lang-mm0lite = ["mettail-languages/lang-mm0lite"]
lang-pyashcore = ["mettail-languages/lang-pyashcore"]
lang-petta = ["mettail-languages/lang-petta"]
lang-rhocalc = ["mettail-languages/lang-rhocalc"]
python-oracle = []

[dependencies]
# Core MeTTaIL
mettail-runtime = { path = "../runtime" }
mettail-languages = { path = "../languages", default-features = false }
mettail-query = { path = "../query", optional = true }

moniker = {workspace = true}

# CLI
rustyline = "14.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"

rand = { workspace = true }

[dev-dependencies]

[build-dependencies]
cc = "1.1"
