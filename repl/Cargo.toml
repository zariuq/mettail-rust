[package]
name = "mettail-repl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mettail"
path = "src/main.rs"
doc = false  # Same binary as root package; document only from workspace root to avoid path collision

[features]
wfst = ["mettail-languages/wfst", "mettail-macros/wfst"]
wfst-log = ["mettail-languages/wfst-log", "mettail-macros/wfst-log"]
mork-backend = ["mettail-languages/mork-backend"]
python-oracle = []

[dependencies]
# Core MeTTaIL
mettail-runtime = { path = "../runtime" }
mettail-languages = { path = "../languages" }
mettail-macros = { path = "../macros" }
mettail-query = { path = "../query" }

moniker = {workspace = true}

# CLI
rustyline = "14.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"

rand = { workspace = true }

# Ascent
ascent = { workspace = true }
ascent-byods-rels = { workspace = true }


[dev-dependencies]

[build-dependencies]
cc = "1.1"
