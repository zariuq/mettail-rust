name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tree-sitter CLI
        shell: bash
        run: npm install -g tree-sitter-cli@0.25.10

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install lld linker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Install Rust (nightly)
        if: matrix.rust == 'nightly'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustc-codegen-cranelift-preview

      - name: Install Rust (stable)
        if: matrix.rust == 'stable'
        uses: dtolnay/rust-toolchain@stable

      - name: Remove nightly-only config (stable + Windows)
        if: matrix.rust == 'stable' || runner.os == 'Windows'
        shell: bash
        run: |
          sed -i.bak '/codegen-backend/d' Cargo.toml
          sed -i.bak '/codegen-backend/d' .cargo/config.toml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all-features --workspace

  low-memory-build:
    name: Low Memory Build Profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.25.10

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview

      - name: Low-memory check (mettail-languages)
        run: ./tools/cargo_lowmem.sh check -p mettail-languages --tests

      - name: Low-memory check (mettail-repl)
        run: ./tools/cargo_lowmem.sh check -p mettail-repl --tests

  low-memory-repl-contract-test:
    name: Low Memory REPL Contract Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.25.10

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview

      - name: Run focused contract-gating test
        env:
          METTAIL_LOWMEM_USE_CRANELIFT: "1"
        run: ./tools/cargo_lowmem.sh test -p mettail-repl core_ground_eval_hint_is_disabled_when_contracts_missing_in_dispatch -- --nocapture

  low-memory-he-transition-check:
    name: Low Memory HE Transition Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.25.10

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview

      - name: Compile-check HE transition smoke target (no link-heavy test run)
        env:
          METTAIL_LOWMEM_USE_CRANELIFT: "1"
        run: ./tools/cargo_lowmem.sh check -p mettail-languages --test mettahe_smoke

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  export-sync:
    name: Lean Export Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.25.10
      - uses: dtolnay/rust-toolchain@stable
      - run: ./tools/check_metta_syntax_export_sync.sh
      - name: Lean syntax/grammar/probe check commands (when algorithms checkout is available)
        run: |
          if [[ -d ../../lean-projects/algorithms ]] && [[ -f ../../lean-projects/algorithms/Algorithms/MeTTa/Simple/Main.lean ]]; then
            cd ../../lean-projects/algorithms
            ulimit -v 6291456 || true
            ART_DIR="../../hyperon/mettail-rust/repl/artifacts/syntax"
            lake exe simpleMeTTa syntax-spec check-all "${ART_DIR}"
            lake exe simpleMeTTa syntax-spec check-grammar-all "${ART_DIR}"
            lake exe simpleMeTTa syntax-spec check-parser-drift-all "${ART_DIR}"
          else
            echo "algorithms checkout unavailable; skipped direct Lean check-* commands"
          fi
      - name: Rust syntax/grammar/lookup loader contract tests
        run: |
          cargo test -p mettail-repl syntax_spec::tests:: -- --test-threads=1
          cargo test -p mettail-repl grammar_spec::tests:: -- --test-threads=1
          cargo test -p mettail-repl lookup_plan::tests:: -- --test-threads=1
      - name: HE export sync (when Lean source or artifact is available)
        run: |
          if [[ -d ../../lean-projects/mettapedia ]] || [[ -f .artifacts/mettahe.generated.rs ]]; then
            ./tools/check_mettahe_export_sync.sh
          else
            echo "skipping mettahe export sync (no mettapedia checkout and no artifact)"
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.25.10
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustc-codegen-cranelift-preview
      - run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.25.10
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

