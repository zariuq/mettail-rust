[package]
name = "mettail-macros"
version = "0.1.0"
edition = "2021"
authors = ["MeTTaIL Contributors"]
license = "MIT"
description = "Procedural macros for MeTTaIL - a meta-language framework for defining formal languages"
repository = "https://github.com/f1r3fly-io/mettail-rust"
homepage = "https://github.com/f1r3fly-io/mettail-rust"
readme = "../README.md"

[lib]
proc-macro = true

[features]
## Propagate WFST features to mettail-prattail.
wfst = ["mettail-prattail/wfst"]
wfst-log = ["mettail-prattail/wfst-log"]
## Enable Ascent datalog code generation.  When OFF the language! macro emits
## only Syntax (types + parser) + metadata — no Ascent fixpoint engine.
ascent-codegen = ["dep:ascent", "dep:ascent-byods-rels", "dep:ascent_syntax_export"]

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
proc-macro-error = { workspace = true }
ascent = { workspace = true, optional = true }
ascent-byods-rels = { workspace = true, optional = true }
moniker = { workspace = true }
indexmap = { workspace = true }
mettail-prattail = { path = "../prattail" }
ascent_syntax_export = { workspace = true, optional = true }

[dev-dependencies]
trybuild = "1.0"
proptest = "1"
